version: '3.8'

services:
  app:
    build: .
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - ./uploads:/app/uploads
    restart: always
    networks:
      - zound-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/app/public:ro
      - ./uploads:/app/uploads:ro
      - ./utils:/app/utils:ro
    depends_on:
      - app
    restart: always
    networks:
      - zound-network

networks:
  zound-network:
    driver: bridge
